[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gh13-cbm-hmm-workflow"
version = "0.1.0"
description = "Auditable profile-HMM screening and cutoff calibration for GH13 and associated CBM families"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Theodore Quinlan"}]
keywords = ["bioinformatics", "dbCAN", "GH13", "HMMER", "metagenomics", "PyHMMER"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "pyhmmer==0.11.0",
    "requests==2.34.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "ruff==0.13.2",
]

[project.scripts]
gh13-cbm-hmm = "gh13_cbm_hmm.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
